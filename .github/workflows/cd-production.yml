# ============================================================================
# CD Pipeline - Production Deployment
# ============================================================================
# Triggers: push para branch main (com aprovação manual)
# Deploy para: Ambiente de Produção
# Requer: Aprovação manual + Health checks
# ============================================================================

name: CD - Deploy to Production

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (tag or sha)'
        required: true
        type: string
      skip_tests:
        description: 'Skip tests (NOT recommended)'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}/backend
  IMAGE_FRONTEND: ${{ github.repository }}/frontend
  ENVIRONMENT: production

jobs:
  # ==========================================================================
  # Pre-deployment Validation
  # ==========================================================================
  pre-deployment-checks:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ✅ Validate Configuration
        run: |
          echo "🔍 Validating deployment configuration..."
          
          # Check if required secrets are set (via GitHub API or manual verification)
          if [ -z "${{ secrets.PROD_HOST }}" ]; then
            echo "❌ PROD_HOST secret not set"
            exit 1
          fi
          
          echo "✅ Configuration validated"

      - name: 📊 Check Staging Health
        run: |
          echo "🏥 Checking staging environment health..."
          if curl -f ${{ secrets.STAGING_API_URL }}/actuator/health; then
            echo "✅ Staging is healthy"
          else
            echo "⚠️  Staging health check failed - proceed with caution!"
          fi

  # ==========================================================================
  # Build & Push Production Images
  # ==========================================================================
  build-and-push:
    name: Build & Push Production Images
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    permissions:
      contents: read
      packages: write
    
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏷️ Generate version tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="prod-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Production Version: ${VERSION}"

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Backend
      - name: 🏷️ Extract Backend metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=production-latest
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 🔨 Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            ENVIRONMENT=production

      # Frontend
      - name: 📥 Checkout frontend repo
        uses: actions/checkout@v4
        with:
          repository: 291294/erp-frontend
          path: erp-frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}

      - name: 🏷️ Extract Frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=production-latest
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 🔨 Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./erp-frontend
          file: ./erp-frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            VITE_API_URL=${{ secrets.PROD_API_URL }}

  # ==========================================================================
  # Manual Approval Gate
  # ==========================================================================
  approval:
    name: 🔐 Manual Approval Required
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production-approval
    
    steps:
      - name: ⏸️ Waiting for approval
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║          🔐 MANUAL APPROVAL REQUIRED                     ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "📦 Version: ${{ needs.build-and-push.outputs.version }}"
          echo "🌍 Environment: PRODUCTION"
          echo "⏰ Waiting for manual approval..."

  # ==========================================================================
  # Deploy to Production (runs on self-hosted runner no servidor)
  # ==========================================================================
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: [self-hosted, linux, erp]
    needs: [build-and-push, approval]
    environment:
      name: production

    steps:
      - name: 💾 Backup Current Version
        run: |
          echo "💾 Creating backup of current deployment..."
          mkdir -p ~/erp-backups ~/erp-production
          if [ -f ~/erp-production/docker-compose.yml ]; then
            cp ~/erp-production/docker-compose.yml \
              ~/erp-backups/docker-compose.yml.$(date +%Y%m%d-%H%M%S)
            docker compose -f ~/erp-production/docker-compose.yml images \
              > ~/erp-backups/images-$(date +%Y%m%d-%H%M%S).txt 2>/dev/null || true
          fi
          echo "✅ Backup completed"

      - name: 🚀 Deploy to Production
        env:
          VERSION: ${{ needs.build-and-push.outputs.version }}
          IMG_BACKEND: ghcr.io/${{ github.repository }}/backend
          IMG_FRONTEND: ghcr.io/${{ github.repository }}/frontend
          DB_NAME: ${{ secrets.PROD_DB_NAME }}
          DB_USER: ${{ secrets.PROD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          JWT_EXPIRATION: ${{ secrets.PROD_JWT_EXPIRATION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║          🚀 PRODUCTION DEPLOYMENT STARTING               ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo "📦 Version: ${VERSION}"
          echo "🕐 Time: $(date)"

          mkdir -p ~/erp-production
          cd ~/erp-production

          # Login to GHCR
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

          # Pull images
          echo "📥 Pulling images..."
          docker pull "${IMG_BACKEND}:${VERSION}"
          docker pull "${IMG_FRONTEND}:${VERSION}"

          # Write docker-compose.yml
          cat > docker-compose.yml << EOF
          version: '3.8'

          networks:
            erp-network:
              driver: bridge

          volumes:
            postgres-data:
            postgres-backups:

          services:
            postgres:
              image: postgres:17-alpine
              container_name: erp-postgres
              environment:
                POSTGRES_DB: ${DB_NAME}
                POSTGRES_USER: ${DB_USER}
                POSTGRES_PASSWORD: ${DB_PASSWORD}
              volumes:
                - postgres-data:/var/lib/postgresql/data
                - postgres-backups:/backups
              networks:
                - erp-network
              restart: always
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
                interval: 10s
                timeout: 5s
                retries: 5

            redis:
              image: redis:7-alpine
              container_name: erp-redis
              networks:
                - erp-network
              restart: always

            backend:
              image: ${IMG_BACKEND}:${VERSION}
              container_name: erp-backend
              environment:
                SPRING_PROFILES_ACTIVE: prod
                SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
                SPRING_DATASOURCE_USERNAME: ${DB_USER}
                SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
                JWT_SECRET: ${JWT_SECRET}
                JWT_EXPIRATION: ${JWT_EXPIRATION}
                JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC"
              ports:
                - "8080:8080"
              networks:
                - erp-network
              depends_on:
                postgres:
                  condition: service_healthy
              restart: always
              healthcheck:
                test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 90s

            frontend:
              image: ${IMG_FRONTEND}:${VERSION}
              container_name: erp-frontend
              ports:
                - "3000:80"
              networks:
                - erp-network
              depends_on:
                - backend
              restart: always
              healthcheck:
                test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
                interval: 30s
                timeout: 5s
                retries: 3
          EOF

          echo "🔄 Rolling update..."
          docker compose -p erp up -d --remove-orphans

          echo "⏳ Aguardando serviços ficarem saudáveis (45s)..."
          sleep 45

          if docker compose -p erp ps | grep -q "Up"; then
            echo "✅ Deployment successful!"
            docker image prune -af --filter "until=168h" || true
          else
            echo "❌ Deployment verification failed!"
            docker compose -p erp ps
            docker compose -p erp logs --tail=50
            exit 1
          fi

      - name: 🏥 Production Health Check
        run: |
          echo "🏥 Running production health checks..."
          sleep 30

          BACKEND_OK=false
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/api/actuator/health > /dev/null 2>&1; then
              echo "✅ Backend is healthy"
              BACKEND_OK=true
              break
            fi
            echo "⏳ Backend check $i/15 - waiting 10s..."
            sleep 10
          done

          if [ "${BACKEND_OK}" != "true" ]; then
            echo "❌ Backend health check failed!"
            exit 1
          fi

          curl -sf http://localhost:3000/ > /dev/null 2>&1 \
            && echo "✅ Frontend is healthy" \
            || echo "⚠️  Frontend check returned non-200 (nginx pode estar ok)"

          echo "✅ Production health checks passed!"

      - name: 📊 Create Deployment Record
        if: success()
        run: |
          mkdir -p ~/erp-production
          cat > ~/erp-production/last-deploy.json << EOF
          {
            "version": "${{ needs.build-and-push.outputs.version }}",
            "environment": "production",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "deployed_by": "${{ github.actor }}",
            "commit": "${{ github.sha }}",
            "status": "success"
          }
          EOF
          cat ~/erp-production/last-deploy.json

      - name: 🎉 Deployment Success Notification
        if: success()
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║      🎉 PRODUCTION DEPLOYMENT SUCCESSFUL! 🎉             ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "🌐 URL: http://192.168.1.73"
          echo "📦 Version: ${{ needs.build-and-push.outputs.version }}"
          echo "👤 Deployed by: ${{ github.actor }}"
          echo "🕐 Time: $(date)"
          echo "📊 Commit: ${{ github.sha }}"

      - name: 🔴 Rollback on Failure
        if: failure()
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║              🔴 AUTOMATIC ROLLBACK                       ║"
          echo "╚══════════════════════════════════════════════════════════╝"

          LATEST=$(ls -t ~/erp-backups/docker-compose.yml.* 2>/dev/null | head -1)
          if [ -f "${LATEST}" ]; then
            echo "📦 Restoring from: ${LATEST}"
            cp "${LATEST}" ~/erp-production/docker-compose.yml
            docker compose -p erp up -d --remove-orphans
            echo "✅ Rollback completed"
          else
            echo "⚠️  No backup found for rollback"
          fi
