# ============================================================================
# Docker Compose - ERP Móveis (Sistema Completo)
# ============================================================================
# Serviços:
#   - PostgreSQL (Database)
#   - Backend API (Spring Boot)
#   - Frontend SPA (React + Nginx)
#   - pgAdmin (Opcional - Gerenciamento DB)
# ============================================================================

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  erp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================================
# VOLUMES (Persistência de dados)
# ============================================================================
volumes:
  postgres-data:
    driver: local
  pgadmin-data:
    driver: local
  redis-data:
    driver: local

# ============================================================================
# SERVICES
# ============================================================================
services:

  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:17-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_moveis}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=pt_BR.UTF-8 --lc-ctype=pt_BR.UTF-8"
      TZ: America/Sao_Paulo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      erp-network:
        ipv4_address: 172.20.0.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ==========================================================================
  # Backend API (Spring Boot)
  # ==========================================================================
  backend:
    build:
      context: ./erp-moveis
      dockerfile: Dockerfile
    image: erp-backend:latest
    container_name: erp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Spring Boot
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-erp_moveis}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      
      # JPA/Hibernate
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_SHOW_SQL: ${SHOW_SQL:-false}
      
      # Flyway
      SPRING_FLYWAY_ENABLED: true
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: true
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Server
      SERVER_PORT: 8080
      
      # Java Options
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
      
      # Timezone
      TZ: America/Sao_Paulo
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      erp-network:
        ipv4_address: 172.20.0.3
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          cpus: '1.0'
          memory: 768M

  # ==========================================================================
  # Frontend SPA (React + Nginx)
  # ==========================================================================
  frontend:
    build:
      context: ./erp-frontend
      dockerfile: Dockerfile
    image: erp-frontend:latest
    container_name: erp-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # API URL (usado em build time via Vite)
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
      TZ: America/Sao_Paulo
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      erp-network:
        ipv4_address: 172.20.0.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ==========================================================================
  # Redis (Cache)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      erp-network:
        ipv4_address: 172.20.0.6
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ==========================================================================
  # pgAdmin (Opcional - Gerenciamento de Banco de Dados)
  # ==========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: erp-pgadmin
    restart: unless-stopped
    profiles:
      - tools  # Ativar com: docker-compose --profile tools up
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@erp-moveis.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      TZ: America/Sao_Paulo
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      erp-network:
        ipv4_address: 172.20.0.5
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

# ============================================================================
# INSTRUÇÕES DE USO
# ============================================================================
# 
# 1. SUBIR SISTEMA COMPLETO:
#    docker-compose up -d
#
# 2. SUBIR COM PGADMIN:
#    docker-compose --profile tools up -d
#
# 3. VER LOGS:
#    docker-compose logs -f
#    docker-compose logs -f backend
#
# 4. PARAR SISTEMA:
#    docker-compose down
#
# 5. PARAR E REMOVER VOLUMES (LIMPAR DADOS):
#    docker-compose down -v
#
# 6. REBUILD (APÓS MUDANÇAS NO CÓDIGO):
#    docker-compose up -d --build
#
# 7. ACESSAR SERVIÇOS:
#    - Frontend:  http://localhost:3000
#    - Backend:   http://localhost:8080/api
#    - Swagger:   http://localhost:8080/swagger-ui/index.html
#    - pgAdmin:   http://localhost:5050
#    - PostgreSQL: localhost:5432
#
# ============================================================================
