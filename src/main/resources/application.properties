# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/erp_moveis}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Desabilitar open-in-view: cada @Transactional usa sua própria Session.
# O TenantFilterAspect ativa o Hibernate filter DENTRO da transação (order=MAX_VALUE).
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=${FLYWAY_CLEAN_DISABLED:true}
spring.flyway.out-of-order=true

# JWT Configuration
# OBRIGATÓRIO: definir JWT_SECRET como variável de ambiente em produção
# Nunca usar o fallback abaixo em produção - é apenas para desenvolvimento local
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Logging Configuration
logging.level.root=INFO
logging.level.com.erp.moveis=DEBUG
logging.level.org.springframework.security=DEBUG

# Promob Integration
promob.watch.enabled=false
promob.watch.directory=C:/Promob/Export
promob.watch.companyId=1

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis

# =============================================================================
# Actuator / Prometheus (Observabilidade)
# =============================================================================
# Endpoints expostos: health (público), prometheus (Docker interno), metrics (ADMIN)
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.prometheus.enabled=true
# Spring Boot 3.x: propriedade nova (a antiga ainda funciona como alias)
management.prometheus.metrics.export.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
management.health.redis.enabled=true

# Tags globais em todas as métricas (permite filtrar por app/env no Grafana)
management.metrics.tags.application=erp-moveis
management.metrics.tags.env=${SPRING_PROFILES_ACTIVE:dev}

# =============================================================================
# Histogramas de latência HTTP (OBRIGATÓRIO para p50/p99 no Grafana)
# Gera buckets cumulativos — necessário para histogram_quantile() no PromQL
# =============================================================================
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# SLOs definidos conforme tolerância do produto (50ms, 200ms, 500ms, 1s, 2s)
management.metrics.distribution.slo.http.server.requests=50ms,200ms,500ms,1s,2s

# =============================================================================
# JVM — habilitar todas as métricas padrão (heap, GC, threads, class loading)
# =============================================================================
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

# =============================================================================
# HikariCP — pool de conexões PostgreSQL
# =============================================================================
management.metrics.enable.hikaricp=true
# Tamanho do pool: mínimo 5, máximo 15 (hardware limitado)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.pool-name=ErpHikariPool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS Allowed Origins
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# =============================================================================
# Cookie Configuration (HttpOnly Cookies — autenticação segura)
# =============================================================================
# Nome dos cookies. Alterar via env var se necessário.
cookie.access.name=${COOKIE_ACCESS_NAME:erp_access_token}
cookie.refresh.name=${COOKIE_REFRESH_NAME:erp_refresh_token}

# Secure=true exige HTTPS. Definir COOKIE_SECURE=true em produção com HTTPS.
# Em desenvolvimento (HTTP) manter false.
cookie.access.secure=${COOKIE_SECURE:false}

# Caminho do refresh cookie visto pelo browser (inclui context-path /api).
# Com Nginx + Spring context-path=/api, o browser vê /api/auth/refresh.
cookie.refresh.path=${COOKIE_REFRESH_PATH:/api/auth/refresh}